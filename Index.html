<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>DriveCoreDZ MARKET</title>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white;text-align:center;}

header{
background:#0b1220;
padding:15px;
border-bottom:2px solid #38bdf8;
}

.logo{color:#38bdf8;font-size:24px;font-weight:bold;}

.section{
background:#1e293b;
width:92%;
margin:10px auto;
padding:12px;
border-radius:12px;
}

input,button{
width:92%;
padding:10px;
margin-top:8px;
border:none;
border-radius:8px;
}

button{background:#22c55e;color:white;cursor:pointer;}

.card{
background:#111827;
padding:10px;
margin-top:8px;
border-radius:10px;
text-align:right;
border:1px solid #334155;
}
</style>
</head>

<body>

<header>
<div class="logo">⚡ DriveCoreDZ MARKET</div>
<button onclick="login()">🔐 تسجيل دخول</button>
</header>

<!-- ADD PRODUCT -->
<div class="section">
<h3>➕ إضافة قطعة</h3>
<input id="name" placeholder="اسم القطعة">
<input id="price" placeholder="السعر">
<input id="shop" placeholder="المحل">
<input id="car" placeholder="السيارة">
<button onclick="addProduct()">إضافة</button>
</div>

<!-- LOAD -->
<div class="section">
<h3>🔍 المنتجات</h3>
<button onclick="loadProducts()">عرض المنتجات</button>
</div>

<!-- ORDERS -->
<div class="section">
<h3>📦 الطلبات</h3>
<button onclick="loadOrders()">عرض الطلبات</button>
</div>

<div id="result" class="section">النتائج هنا...</div>

<script type="module">

/* ================= FIREBASE ================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
getFirestore, collection, addDoc, getDocs 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import { 
getAuth, GoogleAuthProvider, signInWithPopup 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "YOUR_AUTH_DOMAIN",
projectId: "YOUR_PROJECT_ID",
storageBucket: "YOUR_BUCKET",
messagingSenderId: "YOUR_ID",
appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

/* ================= LOGIN ================= */
window.login = async function(){
const provider = new GoogleAuthProvider();
const result = await signInWithPopup(auth, provider);
alert("مرحبا " + result.user.displayName);
}

/* ================= ADD PRODUCT ================= */
window.addProduct = async function(){

await addDoc(collection(db,"products"),{
name:name.value,
price:price.value,
shop:shop.value,
car:car.value,
time:new Date()
});

alert("تمت الإضافة 🚀");

name.value="";
price.value="";
shop.value="";
car.value="";
}

/* ================= LOAD PRODUCTS ================= */
window.loadProducts = async function(){

let data = await getDocs(collection(db,"products"));

let r="";

data.forEach(d=>{
let p=d.data();

r += `
<div class="card">
🧠 ${p.name}<br>
💰 ${p.price}<br>
🏪 ${p.shop}<br>
🚗 ${p.car}<br>
<button onclick='makeOrder("${p.name}","${p.price}","${p.shop}")'>طلب</button>
</div>
`;
});

result.innerHTML = r;
}

/* ================= MAKE ORDER ================= */
window.makeOrder = async function(name,price,shop){

const user = auth.currentUser;

if(!user){
alert("سجل دخول أولاً");
return;
}

await addDoc(collection(db,"orders"),{
productName:name,
price:price,
shop:shop,
userName:user.displayName,
status:"pending",
time:new Date()
});

alert("تم إرسال الطلب 🚀");
}

/* ================= LOAD ORDERS ================= */
window.loadOrders = async function(){

let data = await getDocs(collection(db,"orders"));

let r="📦 الطلبات:<br><br>";

data.forEach(d=>{
let o=d.data();

r += `
<div class="card">
🛒 ${o.productName}<br>
👤 ${o.userName}<br>
🏪 ${o.shop}<br>
📊 ${o.status}
</div>
`;
});

result.innerHTML = r;
}

</script>

</body>
</html>
